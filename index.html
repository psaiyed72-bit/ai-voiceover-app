<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio AI Voiceover Generator Pro</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }
    .app-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 750px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: #94a3b8;
      font-size: 14px;
    }
    select, textarea, input[type="range"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    textarea {
      height: 140px;
      resize: vertical;
    }
    .range-val {
      float: right;
      color: #38bdf8;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-generate {
      background-color: #0284c7;
      color: white;
    }
    .btn-generate:hover {
      background-color: #0369a1;
    }
    .btn-download {
      background-color: #10b981;
      color: white;
      display: none;
    }
    .btn-download:hover {
      background-color: #059669;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #38bdf8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <h2>🎙️ AI Voiceover Studio Pro</h2>
    
    <div class="form-group">
      <label for="voiceSelect">Select Voice / Speaker:</label>
      <select id="voiceSelect">
        <option value="">Loading voices...</option>
      </select>
    </div>

    <!-- Emotion / Tone and Speed Control -->
    <div class="grid-2">
      <div class="form-group">
        <label for="emotionSelect">Voice Emotion / Mood Preset:</label>
        <select id="emotionSelect">
          <option value="neutral">Neutral / Normal Speech</option>
          <option value="thrilled">Thrilled / Excited 🎉</option>
          <option value="suspense">Suspense / Mystery 🕵️</option>
          <option value="fear">Fearful / Dramatic 😨</option>
          <option value="enjoyed">Enjoyed / Happy 😄</option>
          <option value="calm">Calm / Storytelling 📜</option>
        </select>
      </div>

      <div class="form-group">
        <label for="rateInput">Speaking Speed: <span id="rateVal" class="range-val">1.0x</span></label>
        <input type="range" id="rateInput" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('rateVal').innerText = this.value + 'x'">
      </div>
    </div>

    <div class="form-group">
      <label for="pitchInput">Voice Pitch: <span id="pitchVal" class="range-val">1.0</span></label>
      <input type="range" id="pitchInput" min="0.5" max="1.5" step="0.1" value="1.0" oninput="document.getElementById('pitchVal').innerText = this.value">
    </div>

    <div class="form-group">
      <label for="textInput">Script (Hindi, English, Gujarati, Hinglish):</label>
      <textarea id="textInput" placeholder="Yahan apni script type ya paste karein..."></textarea>
    </div>

    <div class="btn-group">
      <button class="btn-generate" onclick="generateSpeech()">Generate & Play Audio</button>
      <button id="downloadBtn" class="btn-download" onclick="downloadAudio()">📥 Download MP3</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    let voices = [];
    let audioUrl = null;
    const voiceSelect = document.getElementById('voiceSelect');
    const downloadBtn = document.getElementById('downloadBtn');

    function populateVoices() {
      voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';

      const preferredLangs = ['hi-IN', 'gu-IN', 'en-IN', 'en-US'];
      
      let filteredVoices = voices.filter(voice => 
        preferredLangs.some(lang => voice.lang.includes(lang))
      );

      if(filteredVoices.length === 0) filteredVoices = voices;

      filteredVoices.forEach((voice) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.setAttribute('data-lang', voice.lang);
        option.setAttribute('data-name', voice.name);
        voiceSelect.appendChild(option);
      });
    }

    populateVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoices;
    }

    function generateSpeech() {
      const text = document.getElementById('textInput').value.trim();
      const status = document.getElementById('status');
      const emotion = document.getElementById('emotionSelect').value;
      
      if (!text) {
        alert('Kripya pehle apni script likhein!');
        return;
      }

      window.speechSynthesis.cancel();
      downloadBtn.style.display = "none";

      const utterance = new SpeechSynthesisUtterance(text);
      const selectedOption = voiceSelect.selectedOptions[0].getAttribute('data-name');
      const selectedVoice = voices.find(voice => voice.name === selectedOption);

      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }

      // Base Speed & Pitch
      let rate = parseFloat(document.getElementById('rateInput').value);
      let pitch = parseFloat(document.getElementById('pitchInput').value);

      // Emotion Auto-Tuning Presets
      if (emotion === 'thrilled') {
        rate = Math.min(rate * 1.15, 2.0);
        pitch = Math.min(pitch * 1.2, 1.5);
      } else if (emotion === 'suspense') {
        rate = Math.max(rate * 0.8, 0.5);
        pitch = Math.max(pitch * 0.85, 0.5);
      } else if (emotion === 'fear') {
        rate = Math.min(rate * 1.1, 2.0);
        pitch = Math.max(pitch * 0.75, 0.5);
      } else if (emotion === 'enjoyed') {
        pitch = Math.min(pitch * 1.15, 1.5);
      } else if (emotion === 'calm') {
        rate = Math.max(rate * 0.9, 0.5);
      }

      utterance.rate = rate;
      utterance.pitch = pitch;

      utterance.onstart = () => {
        status.innerText = `🔊 Playing voiceover (${emotion.toUpperCase()} mood, Speed: ${rate.toFixed(1)}x)...`;
      };

      utterance.onend = () => {
        status.innerText = "✅ Voiceover complete! Click below to download.";
        
        const langCode = selectedVoice ? selectedVoice.lang : 'hi-IN';
        const cleanText = encodeURIComponent(text);
        audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${cleanText}&tl=${langCode}&client=tw-ob`;
        
        downloadBtn.style.display = "block";
      };

      utterance.onerror = () => {
        status.innerText = "❌ Error in audio playback.";
      };

      window.speechSynthesis.speak(utterance);
    }

    async function downloadAudio() {
      const status = document.getElementById('status');
      if (!audioUrl) return;

      status.innerText = "⏳ Preparing MP3 download...";

      try {
        const response = await fetch(audioUrl);
        const blob = await response.blob();
        
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = 'voiceover.mp3';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        status.innerText = "✅ MP3 File downloaded!";
      } catch (error) {
        const a = document.createElement('a');
        a.href = audioUrl;
        a.target = '_blank';
        a.download = 'voiceover.mp3';
        a.click();
        status.innerText = "⚠️ Download opened in new tab. Right-click and save audio.";
      }
    }
  </script>

</body>
</html>
